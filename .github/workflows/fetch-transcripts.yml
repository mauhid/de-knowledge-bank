name: Fetch lecture transcripts

on:
  workflow_dispatch:
  push:
    paths:
      - "transcripts/videos.tsv"
      - "scripts/fetch_transcripts.py"
      - ".github/workflows/fetch-transcripts.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install youtube-transcript-api==1.2.5
      - run: python scripts/fetch_transcripts.py
      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts
          git diff --cached --quiet || git commit -m "Add lecture transcripts"
          git push
